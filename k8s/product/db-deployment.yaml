apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-db
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-db
  template:
    metadata:
      labels:
        app: product-db
    spec:
      containers:
        - name: mongo
          image: mongo:7.0
          ports:
            - containerPort: 27017
          volumeMounts:
            - mountPath: /data/db
              name: product-db-data
      volumes:
        - name: product-db-data
          persistentVolumeClaim:
            claimName: product-db-pvc